<div class="container mx-auto mt-10 max-w-md">
  <div class="bg-white p-8 rounded shadow-md">
    <h3 class="text-2xl font-bold text-center mb-6">Recuperar Senha</h3>

    <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">E-mail</label>
        <input type="email" id="email" formControlName="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" [ngClass]="{ 'border-red-500': submitted && f['email'].errors }">
        <div *ngIf="submitted && f['email'].errors" class="text-red-500 text-xs italic mt-1">
          <div *ngIf="f['email'].errors['required']">O e-mail é obrigatório.</div>
          <div *ngIf="f['email'].errors['email']">O e-mail deve ser válido.</div>
        </div>
      </div>

      <button [disabled]="loading" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none" type="submit">
        <span *ngIf="loading">Aguarde...</span>
        <span *ngIf="!loading">Enviar Link de Recuperação</span>
      </button>
    </form>

    <div class="text-center mt-4">
      <a routerLink="/login" class="inline-block align-baseline font-bold text-sm text-blue-600 hover:text-blue-800">
        Voltar ao Login
      </a>
    </div>
  </div>
</div>
