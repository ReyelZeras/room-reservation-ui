<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="h-16 w-16 bg-blue-700 text-white rounded-xl flex items-center justify-center font-extrabold text-4xl shadow-lg mx-auto cursor-pointer" routerLink="/">R</div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Redefinir Senha</h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">

      <div *ngIf="message" class="bg-green-50 border-l-4 border-green-500 p-4 mb-6">
        <p class="text-sm text-green-700">{{ message }}</p>
        <a routerLink="/login" class="mt-2 text-sm font-medium text-blue-600 hover:text-blue-500 block">Ir para o Login</a>
      </div>

      <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
        <p class="text-sm text-red-700">{{ error }}</p>
      </div>

      <form *ngIf="!message" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nova Senha</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="newPassword" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">

              <button type="button" (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center focus:outline-none text-gray-400 hover:text-gray-600">
              <!-- OLHO ABERTO (Aparece quando a senha ESTÁ VISÍVEL) -->
              <svg *ngIf="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- OLHO COM RISCO (Aparece quando a senha ESTÁ ESCONDIDA) -->
              <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="resetForm.invalid || isLoading" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
            <span *ngIf="!isLoading">Alterar Senha</span>
            <div *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
