<div class="container mx-auto mt-10 max-w-md">
  <div class="bg-white p-8 rounded shadow-md">
    <h3 class="text-2xl font-bold text-center mb-6">Criar Nova Senha</h3>

    <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ errorMessage }}
    </div>

    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="newPassword" class="block text-gray-700 text-sm font-bold mb-2">Nova Senha</label>
        <input type="password" id="newPassword" formControlName="newPassword" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" [ngClass]="{ 'border-red-500': submitted && f['newPassword'].errors }">
        <div *ngIf="submitted && f['newPassword'].errors" class="text-red-500 text-xs italic mt-1">
          <div *ngIf="f['newPassword'].errors['required']">A senha é obrigatória.</div>
          <div *ngIf="f['newPassword'].errors['minlength']">A senha deve ter pelo menos 6 caracteres.</div>
        </div>
      </div>

      <button [disabled]="loading || !token" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none" type="submit">
        <span *ngIf="loading">Aguarde...</span>
        <span *ngIf="!loading">Redefinir Senha</span>
      </button>
    </form>
  </div>
</div>
